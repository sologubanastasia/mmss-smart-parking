# Брокер MQTT для лабораторної роботи 3 (Telemetry Broker периферії й серверний брокер).
# Один файл для обох екземплярів: відрізняються лише мережами в docker-compose.yml.

# Mosquitto 2 без оголошеного слухача приймає з'єднання лише з того самого
# комп'ютера, тому слухача на порту 1883 оголошено явно.
listener 1883

# Анонімний доступ допустимий лише тому, що порт опубліковано на 127.0.0.1,
# а брокер периферії взагалі не має опублікованого порту. У розгортанні парковки
# тут будуть TLS (listener 8883, cafile/certfile/keyfile) і облікові записи
# пристроїв з ACL за темами (ADR-0002, NFR-05).
allow_anonymous true

# Надсилати PUBACK одразу, без алгоритму Нейгла: інакше шлюз упирається
# в ≈ 2000 повідомлень/с при вільному процесорі (методичка, крок 1).
set_tcp_nodelay true
