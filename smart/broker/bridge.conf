# Додатково: брокер периферії з мостом Mosquitto замість власного шлюзу gateway.py.
# Варіант А — звичайний міст. Використовується лише з smart/docker-compose.bridge.yml
# для порівняння під час розриву зв'язку (docs/deployment.md, «Розрив зв’язку»).
listener 1883
allow_anonymous true
set_tcp_nodelay true

# Черга моста зберігається на томі; Mosquitto пише її знімком (autosave),
# а не журналом, тож аварія процесу втрачає зміни після останнього знімка.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
# Місткість черги — як MAX_ROWS шлюзу. На відміну від шлюзу, переповнена
# черга відкидає нові повідомлення, а не найстаріші.
max_queued_messages 50000

connection cloud
address cloud-broker:1883
remote_clientid za-bridge
local_clientid za-bridge-local
cleansession false
keepalive_interval 10
restart_timeout 1 5
topic p1/+/+/tele out 1
